# The agents this application uses, written by install.sh (init, or upgrade --agents).
# Each one gets the skills in its own directory. The scripts read the roles from here,
# so the scheduled task always runs the same command. Change the agents with
# `<release>/bin/install.sh upgrade <app> --agents ...`; a role, the order and the permissions may be edited by hand.
# The agents the kit supports (an agent not listed in agents gets no skills here):
#   claude    Claude Code             skills in .claude/skills/
#   codex     OpenAI Codex            skills in .agents/skills/
#   copilot   GitHub Copilot          skills in .github/skills/
#   hermes    Hermes                  skills in .hermes/skills/
#   opencode  OpenCode                skills in .opencode/skills/
#   agy       Google Antigravity      skills in .agents/skills/
#   kilo      Kilo Code               skills in .kilocode/skills/
#   cline     Cline                   skills in .cline/skills/
#   pi        pi                      skills in .pi/skills/
#   omp       oh-my-pi, a fork of pi  skills in .omp/skills/
#   crush     Charm's Crush           skills in .crush/skills/
agents: [claude]
# Each role lists its agents in order of preference. One that fails (out of quota, not
# logged in, timed out) is tried again limits.agent_retries times (config/pipeline.yaml),
# then the next one runs and continues from what the failed attempts left.
roles:
  plan:  [claude] # writes the OpenSpec artifacts of each backlog item
  build: [claude] # implements the tasks in the child repositories
  cycle: [claude] # runs the judgment of the scheduled cycle
# fallback: every call starts with the first agent of its role, then the next when one
# fails. random: every call starts with any agent of its role, then the others in the
# order listed, so the calls spread over the agents' quotas instead of draining the first.
order: fallback
# all: agents may run any command (servers, curl, browsers, test tools), except the git
# commands only the scripts run (commit, push, rebase, reset, checkout, switch).
# restricted: Claude Code may only read, edit, run openspec, inspect git, run the gates
# and ask Jev; Codex and Antigravity (agy) keep their sandbox; Kilo and omp follow their own approval settings; pi loads no project extensions. Hermes, Copilot, OpenCode, Cline and Crush ignore it.
permissions: all
