# ==============================================================================
# config/cycle.yaml - Settings of the scheduled cycle
# ==============================================================================
# Seed: created once by install.sh, then owned by this application. Humans edit
# it; the scripts read it and write the cycle's plan into the judgment agent's
# prompt, so the scheduled task's prompt never changes. The cycle's state and
# reports are runtime files under log/cycle/ (git-ignored); durable lessons go to
# MEMORY.md and memory/.

# Minutes the cycle agent may spend verifying delivered work and exploring.
qa_time_budget_minutes: 45

# Consecutive cycles whose dispatch ended with every change blocked before the
# cycle stops queuing new work and reports it as needing a human.
max_consecutive_failures: 2

exploration:
  minutes: 15 # at least this much of the budget goes to exploring
  max_new_backlog_items_per_cycle: 3 # findings queued or proposed per cycle; the rest stay in the report
  # The strategies, one per cycle, are in config/exploration.yaml.

roadmap:
  file: ROADMAP.md # features to build, in priority order; empty: no roadmap
  max_new_per_cycle: 1 # roadmap features proposed per cycle
  max_open: 3 # propose none while this many roadmap proposals are proposed, approved or queued

proposals:
  # Who approves the proposals in config/agent_proposals.json (improvements, missing
  # capabilities, roadmap features) before they are queued:
  #   jev    Jev (gate proposal_review of config/jev_policy.yaml); what it does not
  #          approve waits for a human
  #   human  a person: ruby bin/proposals.rb approve <change>
  #   auto   nobody: every proposal is queued
  approval: jev
  # Who approves a prompt proposal: an edit of config/prompts/plan.md, build.md or
  # cycle.md that the cycle bases on evidence (repair rounds, bin/prompt_report.rb).
  # Once approved, bin/proposals.rb applies and checks it, and the cycle records it.
  #   human  a person: ruby bin/proposals.rb show <change>, then approve <change>
  #   auto   nobody: it is applied after the judgment that proposed it
  prompt_approval: human

visual_qa:
  # A browser session in an agent app (Claude, Hermes), scheduled as its own task
  # with the openspec-kit-visual-qa skill's routine prompt. The headless cycle queues
  # every change the merger integrates for it, and leaves it the strategies of
  # config/exploration.yaml that need a browser. false: the headless cycle does
  # everything, as well as it can without a browser.
  enabled: true
  minutes: 40 # time budget of one session
  max_items_per_session: 5 # queued checks one session takes; the rest wait
  # The OPENSPEC_SLOT of the session's commands, which run in .worktrees/_visual_qa (what is on
  # origin). false: none, so the ports and databases of the main checkout, and the browser's
  # approvals for them. A number (97 is free) gives the session its own ports and databases, as
  # each repository's env_script derives them; its service.prepare readies them.
  slot: false

memory:
  # MEMORY.md holds what applies to every change, and every agent reads it on every
  # call. memory/repos/<name>.md and memory/specs/<capability>.md hold what applies
  # to one child repository or capability; the PLAN and BUILD prompts point to
  # them, so only the changes that touch that scope read them. Over a cap, the next
  # cycle and visual session are told to trim that file first.
  max_chars: 12000 # MEMORY.md
  scoped_max_chars: 6000 # each file under memory/

qa:
  # Application skills the cycle and the visual session use to verify and explore,
  # for example [browser-qa, live-qa-sweep]. Empty: gates, code reading and, in the
  # visual session, the agent app's own browser.
  skills: []
