# ==============================================================================
# config/pipeline.yaml - How the pipeline runs: base branch, parallelism, limits
# ==============================================================================
# Seed: created once by install.sh, then owned by this application. Humans edit
# it (ruby bin/kit_config.rb set pipeline.<key> <value>); the dispatcher, the
# merger, the cycle and the visual QA session read it on every run, so a
# scheduled command never carries a setting. The environment variable named
# after each key overrides it for one manual run only.

# The branch of this repository that every change starts from and the merger
# publishes to, on origin. Each child repository names its own base branch in
# its repo.config.yaml.
base_branch: master # OPENSPEC_BASE_BRANCH

dispatch:
  workers: 2 # changes one dispatch builds in parallel; OPENSPEC_WORKERS
  wait_seconds: 3600 # how long a cycle's dispatch waits while changes wait on merges; OPENSPEC_WAIT_TIMEOUT
  merge_interval_seconds: 10 # how often a watching merger looks for ready changes; OPENSPEC_MERGE_INTERVAL
  # A change whose code no longer rebases onto the base branch (another change edited
  # the same lines first) is rebuilt on the new base this many times before it waits
  # for a human as rebase_conflict. While a rebuild runs, another change may merge into
  # the same files again. 0: never rebuild. OPENSPEC_CONFLICT_REBUILDS
  conflict_rebuilds: 3
  # Every this many hours an item waits in the backlog, it is ordered one priority
  # higher (low, normal, high, critical), so low items are not starved by a steady
  # flow of higher ones. Its priority in the backlog does not change. 0: off.
  # OPENSPEC_AGING_HOURS
  aging_hours: 6

limits:
  agent_seconds: 7200 # one attempt of an agent (the cycle's judgment: qa_time_budget_minutes + 15); AGENT_TIMEOUT_SECONDS
  # An agent call that fails (timeout, usage limit, error) is tried again this many
  # times with the same agent, then with the next agent of its role. An attempt that
  # left changes is followed by one told what it changed, to continue from there.
  # 0: no retry. AGENT_RETRIES
  agent_retries: 1
  agent_retry_delay_seconds: 120 # wait before trying the same agent again; AGENT_RETRY_DELAY_SECONDS
  agent_budget_usd: 5 # Claude Code's spending cap per call; AGENT_MAX_BUDGET_USD
  gate_seconds: 2700 # one repository's gates, in the dispatcher and the merger; OPENSPEC_GATE_TIMEOUT
  lease_seconds: 7200 # a change's lease is stale after this; OPENSPEC_LEASE_TTL
