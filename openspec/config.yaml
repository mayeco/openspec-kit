# ==============================================================================
# openspec/config.yaml - Multi-Agent Framework Template Configuration
# ==============================================================================
schema: spec-driven

# Project context injected into all OpenSpec agent workflows
context: |
  Project: {{PROJECT_NAME}} - {{PROJECT_DESCRIPTION}}.
  Code lives in child repositories under repos/ ({{APP_REPO}}, {{FRONTEND_REPO}}, {{INFRA_REPO}});
  specifications live only in this umbrella's openspec/ directory.
  Language Policy: all code, comments, documentation, specs and commits MUST be professional English.
  Git Discipline: agents never commit, push, rebase, reset or switch branches. The dispatcher commits
  worker output on feat/spec-<change> branches; only the merger publishes base branches.
  Canonical specs (openspec/specs/) change only through `openspec archive`, run by the merger.
  Testing Standard: every feature and bug fix MUST be proven by automated tests.
  Quality Gates: `bash bin/run_gates.sh` runs the gates each touched repo declares in repo.config.yaml.

# Per-artifact authoring rules (returned by `openspec instructions <artifact>`)
rules:
  proposal:
    - "Keep proposals concise, self-contained and under 800 words"
    - "Always include Why, What Changes, Capabilities and Impact sections"
    - "Declare at least one New or Modified Capability, or set skip_specs: true in .openspec.yaml"
    - "Never invent capability names; check `openspec list --specs --json` first"
    - "State which repos/ the change touches and any shared hotspots (migrations, lockfiles, route registries)"
  specs:
    - "Keep each requirement statement at or under 500 characters (--strict fails above that)"
    - "Use RFC 2119 keywords for normative statements: SHALL, MUST, SHALL NOT"
    - "Every requirement MUST have at least one scenario"
    - "CRITICAL: scenarios MUST use exactly four hashtags: #### Scenario: <Name>"
    - "Scenarios use WHEN/THEN (and AND) bullet clauses"
    - "A new capability MUST include a ## Purpose of at least 50 characters"
    - "A MODIFIED requirement MUST repeat the complete current block (statement and every surviving scenario)"
  design:
    - "Focus on architecture, patterns and decision rationale"
    - "Define Goals and Non-Goals explicitly"
    - "Document trade-offs, security considerations, data migrations and the rollback strategy"
  tasks:
    - "Group tasks under numbered sections (## 1. Setup, ## 2. Core Implementation)"
    - "Every task MUST be a checkbox: - [ ] X.Y Description"
    - "Every task MUST state its verification (test command or observable behavior)"
    - "Pair every code task with its automated test task"

# Operation guidance (advisory; returned by `openspec instructions apply|archive`)
operations:
  apply:
    guidance:
      - "Run `bash bin/run_gates.sh` before marking the last task complete"
      - "If an unexpected data migration or schema change emerges, write the question to .needs-human and stop"
      - "Record non-obvious lessons in openspec/changes/<change>/handoff.md"
  archive:
    guidance:
      - "Archiving is performed by the merger with `openspec archive --yes --json`; agents do not archive"
